spring:
  application:
    name: inventory-management
  datasource:
    url: jdbc:h2:file:./data/inventory;AUTO_SERVER=TRUE
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate.jdbc.batch_size: 200
      hibernate.order_inserts: true
  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8080
  servlet:
    session:
      timeout: 8h
      cookie:
        http-only: true
        same-site: lax

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

app:
  zone: Asia/Singapore
  seed:
    enabled: true
  report:
    # 01:00 on the 1st of every month (Singapore time) -> report for the month just closed
    cron: "0 0 1 1 * *"

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%X{correlationId:-}] %logger{36} - %msg%n"
