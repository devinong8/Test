server:
  port: 8080

spring:
  application:
    name: appointment-management
  datasource:
    # SQLite file in the working directory. foreign_keys must be enabled per connection in SQLite.
    url: jdbc:sqlite:${APP_DB_FILE:appointments.db}?foreign_keys=on&busy_timeout=5000&journal_mode=WAL
    driver-class-name: org.sqlite.JDBC
    hikari:
      # SQLite allows one writer at a time; a single pooled connection serialises access cleanly.
      # (The booking logic is still race-safe on multi-connection databases - see design doc.)
      maximum-pool-size: 1
  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: none          # schema is owned by schema-<platform>.sql (explicit constraints & indexes)
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  sql:
    init:
      mode: always
      platform: sqlite
  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: true    # typos in request bodies -> 400 instead of being silently ignored
  mvc:
    problemdetails:
      enabled: false

app:
  timezone: Asia/Singapore
  min-slot-minutes: 15
  max-slot-minutes: 480
  max-advance-days: 365
  cancellation-cutoff-minutes: 60
  max-page-size: 100
  expiry-sweep-interval-ms: 60000
  seed-demo-data: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info
