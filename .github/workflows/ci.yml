name: CI

# Every push and pull request runs the full verification:
#   1. integration tests on SQLite
#   2. the same tests on PostgreSQL 16 (where race conditions are real) + coverage report
#   3. black-box acceptance check, load test and database integrity check against the running server
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests-sqlite:
    name: Tests · SQLite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run integration tests (SQLite)
        run: mvn -B test
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sqlite-test-reports
          path: target/surefire-reports/

  tests-postgres:
    name: Tests · PostgreSQL 16 + coverage
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: appointments_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run integration tests (PostgreSQL, 10-connection pool)
        run: mvn -B test -Dtest.profiles=test,postgres,pgtest
      - name: Coverage summary
        run: |
          python3 - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import csv
          rows = list(csv.DictReader(open('target/site/jacoco/jacoco.csv')))
          c = sum(int(r['LINE_COVERED']) for r in rows); m = sum(int(r['LINE_MISSED']) for r in rows)
          print(f"### Line coverage: {100 * c / (c + m):.1f}% ({c}/{c + m})")
          EOF
      - name: Upload coverage and test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postgres-coverage-and-tests
          path: |
            target/site/jacoco/
            target/surefire-reports/

  acceptance-and-load:
    name: Acceptance + load + integrity · PostgreSQL 16
    runs-on: ubuntu-latest
    needs: [tests-sqlite, tests-postgres]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: appointments
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build
        run: mvn -B -DskipTests package
      - name: Start the server on PostgreSQL
        run: |
          nohup java -jar target/appointment-management-1.0.0.jar \
            --spring.profiles.active=postgres --app.seed-demo-data=false > server.log 2>&1 &
          for i in $(seq 1 60); do
            curl -fs http://localhost:8080/actuator/health | grep -q UP && exit 0
            sleep 2
          done
          cat server.log; exit 1
      - name: Acceptance check (56 checks mapped to the brief, R1-R5)
        run: ./acceptance-check.sh
      - name: Load test
        run: |
          python3 perf/loadtest.py | tee load.txt
          { echo '### Load test'; echo '```'; cat load.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Database integrity check after load (fails the build on any violation)
        run: psql -h localhost -U postgres -v ON_ERROR_STOP=1 -d appointments -f perf/integrity-assert.sql
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-load-results
          path: |
            perf/results.json
            load.txt
            server.log
